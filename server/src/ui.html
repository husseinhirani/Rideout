<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RideOut backend test console</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px;
    background: #111417; color: #d7dde3;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ea76a; }
  .dot.off { background: #6b7076; }
  .tag { border: 1px solid #3a4148; border-radius: 3px; padding: 1px 6px; font-size: 11px; color: #9aa4ad; }
  .tag.sim { border-color: #6b5a2a; color: #d6b45c; }
  section { border: 1px solid #262b30; border-radius: 4px; margin-bottom: 12px; }
  section > h2 {
    margin: 0; padding: 6px 10px; border-bottom: 1px solid #262b30;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #8d969e;
  }
  .body { padding: 10px; }
  .muted { color: #7f888f; }
  .quote { color: #9aa4ad; font-style: italic; }
  .row { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid #1c2024; }
  .row:last-child { border-bottom: 0; }
  .row.pick { cursor: pointer; }
  .row.pick:hover { background: #171b1f; }
  .row.sel { background: #1b2228; }
  .name { min-width: 150px; color: #e7edf3; }
  .grow { flex: 1; min-width: 0; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid #3a4148; color: #9aa4ad; white-space: nowrap; }
  .badge.ringing { border-color: #35566f; color: #78b0d8; }
  .badge.answered { border-color: #2f5c40; color: #6fc08c; }
  .badge.no_answer { border-color: #4a4a4a; color: #8a8a8a; }
  .badge.closed { border-color: #4a4a4a; color: #8a8a8a; }
  .badge.open { border-color: #35566f; color: #78b0d8; }
  .badge.needs_dispatcher { border-color: #6b5a2a; color: #d6b45c; }
  .flag { color: #d6b45c; }
  label { display: block; font-size: 11px; color: #8d969e; margin-bottom: 4px; }
  textarea, input {
    width: 100%; box-sizing: border-box;
    background: #0d1013; color: #d7dde3;
    border: 1px solid #333a41; border-radius: 3px; padding: 6px 8px;
    font: inherit; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: #4a6f8c; }
  button {
    background: #22292f; color: #d7dde3; border: 1px solid #3a4148;
    border-radius: 3px; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2c343b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.go { border-color: #3d6b4f; color: #8fd4a6; }
  .bar { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
  .err { background: #3a1f20; border: 1px solid #6b3134; color: #e4a1a3; padding: 6px 10px; border-radius: 3px; margin-bottom: 12px; }
  ul { margin: 4px 0 0; padding-left: 18px; }
  li { color: #9aa4ad; }
  .sub { font-size: 11px; color: #7f888f; }
  .sim-box { display: flex; gap: 6px; margin-top: 4px; }
  .sim-box textarea { height: 38px; }
  .sim-box input { max-width: 190px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>RideOut backend test console</h1>
    <span class="tag" id="sim">MODE UNKNOWN</span>
    <span class="grow"></span>
    <span class="dot off" id="dot"></span>
    <span class="sub" id="dotText">connecting</span>
  </div>

  <div class="err" id="err" hidden></div>
  <div class="sub" id="environment">Waiting for backend state. This console is separate from the product UI.</div>
  <section>
    <h2>Available profiles</h2>
    <div class="body">
      <label>Directory filter (optional JSON: profile_ids, radius, related_to_profile_id, tags)</label>
      <input id="directoryFilter" placeholder='{"related_to_profile_id":1}'>
      <div class="bar"><button id="searchProfiles" disabled>Find people</button><span class="sub">Search never calls anyone. Coordinates are stored directory data.</span></div>
      <div id="profiles">Waiting for the database.</div>
    </div>
  </section>

  <section>
    <h2>What is happening?</h2>
    <div class="body">
      <textarea id="newIncident" rows="2" placeholder="Describe what is happening"></textarea>
      <label>What do you need to find out?</label><textarea id="newObjective" rows="2" placeholder="Which entrances are accessible?"></textarea>
      <div class="bar">
        <button class="go" id="openIncident" disabled>Open incident</button>
        <span class="sub" id="newHint"></span>
      </div>
    </div>
  </section>

  <div id="view"></div>
  <section><h2>Incoming reports awaiting association</h2><div class="body" id="incoming"></div></section>
</div>

<script>
"use strict"

const POLL_MS = 2000

let state = null
let selectedIncident = null
let selectedCase = null
let busy = false
let connected = false
let lastSeenAt = 0
let directory = null
const selectedProfiles = new Set()
const pendingCommands = new Map()

const els = {
  sim: document.getElementById("sim"),
  dot: document.getElementById("dot"),
  dotText: document.getElementById("dotText"),
  err: document.getElementById("err"),
  view: document.getElementById("view"),
  newIncident: document.getElementById("newIncident"),
  newObjective: document.getElementById("newObjective"),
  newHint: document.getElementById("newHint"),
  environment: document.getElementById("environment"),
  profiles: document.getElementById("profiles"),
}

// --------------------------------------------------------------- plumbing

function showError(message) {
  els.err.textContent = message
  els.err.hidden = !message
}

async function post(path, body) {
  if (!connected) throw new Error("Backend disconnected. Wait for a fresh state before making changes.")
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  })
  let payload = {}
  try { payload = await response.json() } catch { payload = {} }
  if (!response.ok) throw new Error(payload.error || ("request failed (" + response.status + ")"))
  showError("")
  return payload
}

// Sending always re-renders, so the poll never has to fight the keyboard.
async function send(button, work) {
  if (busy) return
  busy = true
  const label = button ? button.textContent : ""
  if (button) { button.disabled = true; button.textContent = "..." }
  try {
    await work()
    await poll()
    render()
  } catch (error) {
    showError(error.message || "request failed")
  } finally {
    if (button) button.textContent = label
    busy = false
    updateControls()
  }
}

async function poll() {
  const response = await fetch("/state", { signal: AbortSignal.timeout(10000) })
  if (!response.ok) throw new Error("state failed (" + response.status + ")")
  state = await response.json()
  connected = true
  lastSeenAt = Date.now()
  els.sim.textContent = state.simulate ? "SIMULATED CALLS" : "REAL CALLS"
  els.sim.classList.toggle("sim", state.simulate)
  const mode = state.demo_mode || {}
  els.environment.textContent = "Database: " + (mode.database || "not reported")
    + " · Planning: " + (mode.scripted === true ? "SCRIPTED" : mode.scripted === false ? "Manual selection; Claude interprets reports" : "not reported")
    + " · Automatic coordination: " + (mode.auto_coordinate === true ? "on" : mode.auto_coordinate === false ? "off" : "not reported")
  renderProfiles()
  renderIncoming()
  els.dot.classList.remove("off")
  els.dotText.textContent = "connected"
  updateControls()
}

function updateControls() {
  for (const button of document.querySelectorAll("button")) {
    button.disabled = busy || !connected || button.dataset.locked === "true"
  }
}

function renderProfiles() {
  els.profiles.replaceChildren()
  for (const profile of directory || state.profiles || []) {
    const line = el("div", "row")
    const contacts = (profile.contact_profile_ids || []).map(personName).join(", ") || "none"
    const check = el("input")
    check.type = "checkbox"; check.style.width = "auto"; check.checked = selectedProfiles.has(profile.id)
    check.onchange = () => check.checked ? selectedProfiles.add(profile.id) : selectedProfiles.delete(profile.id)
    line.append(check)
    line.append(el("span", "name", "#" + profile.id + " " + profile.name))
    line.append(el("span", "sub", (profile.phone_last4 ? "Phone ending " + profile.phone_last4 : "No phone") + " · Contacts: " + contacts))
    const preference = (state.profile_settings || []).find(p => p.profile_id === profile.id)
    line.append(el("span", "sub", preference?.call_consent ? "Calls allowed" : "Call consent not recorded"))
    els.profiles.append(line)
  }
  if (!(directory || state.profiles || []).length) els.profiles.textContent = "No profiles loaded."
}

// The poll must never eat half-typed text. Anything the dispatcher has
// started writing holds the render until they send or clear it.
function renderIncoming() {
  const target = document.getElementById("incoming")
  target.replaceChildren()
  for (const request of state.incoming_requests || []) {
    const row = el("div", "row")
    row.append(el("span", "sub", "#" + request.id + " · " + request.status))
    row.append(el("span", "grow", request.text))
    target.append(row)
  }
  if (!target.childNodes.length) target.textContent = "No incoming reports."
}

// A retry of the same command reuses its receipt key; changed content is a new command.
function command(path, body) {
  const key = path + JSON.stringify(body)
  if (!pendingCommands.has(key)) pendingCommands.set(key, crypto.randomUUID())
  return post(path, { ...body, command_id: pendingCommands.get(key) }).then(result => {
    pendingCommands.delete(key)
    return result
  })
}

function typing() {
  const active = document.activeElement
  if (!active) return false
  const isField = active.tagName === "TEXTAREA" || active.tagName === "INPUT"
  return isField && active.value.trim().length > 0
}

async function tick() {
  try {
    await poll()
    if (!busy && !typing()) render()
  } catch {
    connected = false
    els.dot.classList.add("off")
    els.dotText.textContent = "disconnected" + (lastSeenAt ? " · last update " + Math.floor((Date.now() - lastSeenAt) / 1000) + "s ago" : "")
    updateControls()
  }
}

// ----------------------------------------------------------------- shapes

function parseBrief(stored) {
  if (!stored || !stored.trim()) return null
  try {
    const parsed = JSON.parse(stored)
    return {
      summary: typeof parsed.summary === "string" ? parsed.summary : stored,
      suggestions: Array.isArray(parsed.suggestions) ? parsed.suggestions : [],
    }
  } catch {
    return { summary: stored, suggestions: [] }
  }
}

function personName(id) {
  const row = (state.profiles || []).find((item) => item.id === id)
  return row ? row.name : "#" + id
}

function personPhone(id) {
  const row = (state.profiles || []).find((item) => item.id === id)
  return row && row.phone ? row.phone : ""
}

function clock(iso) {
  if (!iso) return ""
  const at = new Date(iso)
  return isNaN(at) ? "" : at.toTimeString().slice(0, 5)
}

function el(tag, className, text) {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

function briefBlock(brief) {
  const box = document.createDocumentFragment()
  if (!brief) {
    box.append(el("div", "muted", "no brief yet"))
    return box
  }
  box.append(el("div", "", brief.summary))
  if (brief.suggestions.length > 0) {
    const list = el("ul")
    for (const line of brief.suggestions) list.append(el("li", "", line))
    box.append(list)
  }
  return box
}

// ----------------------------------------------------------------- render

function render() {
  if (!state) return
  const incidents = (state.incidents || []).slice().sort((a, b) => b.id - a.id)
  els.view.replaceChildren()
  if (incidents.length === 0) {
    els.newHint.textContent = "Describe an incident and an information objective; select the permitted contacts above."
    return
  }
  els.newHint.textContent = ""
  if (!incidents.some((row) => row.id === selectedIncident)) selectedIncident = incidents[0].id
  const incident = incidents.find((row) => row.id === selectedIncident)

  const cases = (state.cases || [])
    .filter((row) => row.incident_id === incident.id)
    .sort((a, b) => b.id - a.id)
  if (!cases.some((row) => row.id === selectedCase)) {
    const open = cases.find((row) => row.status !== "closed")
    selectedCase = open ? open.id : (cases[0] ? cases[0].id : null)
  }

  els.view.append(incidentSection(incident, incidents, cases))
  els.view.append(caseListSection(cases))
  const current = cases.find((row) => row.id === selectedCase)
  if (current) els.view.append(caseSection(current))
  updateControls()
}

function incidentSection(incident, incidents, cases) {
  const node = el("section")
  const head = el("h2", "", "Incident · " + incident.type)
  if (incidents.length > 1) {
    const picker = el("select")
    picker.style.cssText = "float:right;background:#0d1013;color:#d7dde3;border:1px solid #333a41;font:inherit"
    for (const row of incidents) {
      const option = el("option", "", "#" + row.id + " " + row.type)
      option.value = row.id
      if (row.id === incident.id) option.selected = true
      picker.append(option)
    }
    picker.onchange = () => { selectedIncident = Number(picker.value); selectedCase = null; render() }
    head.append(picker)
  }
  node.append(head)

  const body = el("div", "body")
  body.append(el("div", "quote", '"' + incident.description + '"'))
  body.append(briefBlock(parseBrief(incident.brief)))

  const people = (state.incident_people || []).filter((row) => row.incident_id === incident.id)
  if (people.length > 0) {
    const count = (status) => people.filter((row) => row.status === status).length
    body.append(el("div", "sub", "triage: " + count("safe") + " safe · "
      + count("checking_in") + " checking in · " + count("victim") + " needs help"))
  }
  body.append(el("div", "sub", cases.length + " case" + (cases.length === 1 ? "" : "s")))
  node.append(body)
  return node
}

function caseListSection(cases) {
  const node = el("section")
  node.append(el("h2", "", "Cases"))
  const body = el("div", "body")
  if (cases.length === 0) {
    body.append(el("div", "muted", "no cases on this incident yet"))
  }
  for (const row of cases) {
    const pending = (state.attempts || [])
      .filter((item) => item.support_case_id === row.id && item.outcome === null).length
    const line = el("div", "row pick" + (row.id === selectedCase ? " sel" : ""))
    line.append(el("span", "name", row.kind === "information" ? "Case #" + row.id : personName(row.victim_profile_id)))
    line.append(el("span", "badge " + row.status, row.status.replace("_", " ")))
    line.append(el("span", "grow sub", pending > 0 ? pending + " without an interpreted report" : ""))
    line.onclick = () => { selectedCase = row.id; render() }
    body.append(line)
  }
  node.append(body)
  return node
}

function caseSection(current) {
  const node = el("section")
  node.append(el("h2", "", "Case #" + current.id))
  const body = el("div", "body")

  body.append(el("div", "sub", "goal: " + current.goal))
  body.append(briefBlock(parseBrief(current.brief)))

  const calls = (state.attempts || []).filter((row) => row.support_case_id === current.id)
  body.append(el("h2", "", "Calls"))
  if (calls.length === 0) body.append(el("div", "muted", "no calls placed yet"))
  for (const call of calls) {
    const outcome = call.outcome || "pending"
    const progress = (state.attempt_progress || []).find(row => row.attempt_id === call.id)
    const binding = (state.information_attempts || []).find(row => row.attempt_id === call.id)
    const line = el("div", "row")
    const who = el("span", "name", personName(call.profile_id))

    line.append(who)
    line.append(el("span", "badge " + outcome, "Report: " + (call.outcome ? outcome.replace("_", " ") : progress?.report_received ? "received; processing" : "not received")))
    const detail = el("span", "grow")
    const ask = el("div", "sub", call.ask)
    ask.title = call.ask
    detail.append(ask)
    detail.append(el("div", "sub", "Attempt #" + call.id + " · Provider: " + (call.call_id || "not recorded")
      + " · Transport: " + (progress ? progress.transport : "not tracked by legacy call path")))
    if (binding) detail.append(el("div", "sub", "Binding: " + binding.binding_status + " · Provider outcome: " + (binding.provider_terminal_status || "not terminal") + (binding.interpretation_error ? " · Interpretation: " + binding.interpretation_error : "")))
    if (call.answer) detail.append(el("div", "quote", '"' + call.answer + '"'))
    if (state.simulate && call.outcome === null) detail.append(simulateBox(call.id))
    line.append(detail)
    body.append(line)
  }

  const notes = (state.notes || []).filter((row) => row.support_case_id === current.id)
  const facts = notes.filter((row) => row.source !== "concern")
  const flags = notes.filter((row) => row.source === "concern")

  body.append(el("h2", "", "Notes"))
  if (facts.length === 0) body.append(el("div", "muted", "nothing recorded yet"))
  for (const note of facts) {
    const line = el("div", "row")
    line.append(el("span", "sub", clock(note.at) + " " + note.source))
    const text = el("span", "grow", note.text)
    if (note.lat !== null && note.lat !== undefined) {
      text.append(el("span", "sub", "  (" + note.lat.toFixed(4) + ", " + note.lng.toFixed(4)
        + (note.radius_m ? " r" + Math.round(note.radius_m) + "m" : "") + ")"))
    }
    line.append(text)
    body.append(line)
  }

  body.append(el("h2", "", "Flags"))
  if (flags.length === 0) body.append(el("div", "muted", "none"))
  for (const note of flags) {
    const line = el("div", "row")
    line.append(el("span", "sub", clock(note.at)))
    line.append(el("span", "grow flag", note.text))
    body.append(line)
  }

  body.append(current.kind === "information" ? informationBox(current) : el("div", "muted", "Legacy history is read-only in this console."))
  node.append(body)
  return node
}

function simulateBox(attemptId) {
  const box = el("div", "sim-box")
  const answer = el("textarea")
  answer.placeholder = "what did they say?"
  const concern = el("input")
  concern.placeholder = "concern (optional)"
  const button = el("button", "go", "Send")
  button.onclick = () => {
    if (!answer.value.trim()) { showError("answer is required"); return }
    send(button, () => post("/simulation/report", {
      attempt_id: attemptId,
      answer: answer.value,
      concern: concern.value,
    }))
  }
  box.append(answer, concern, button)
  return box
}

function informationBox(current) {
  const box = el("div")
  box.append(el("h2", "", "Organizer-directed information call"))
  box.append(el("div", "sub", "Revision " + current.input_revision + ". This step calls the selected person with your question. Automatic planning comes after this checkpoint."))
  const person = el("select")
  for (const profile of state.profiles || []) {
    const option = el("option", "", profile.name)
    option.value = profile.id; person.append(option)
  }
  const question = el("textarea"); question.placeholder = "What should Tom ask?"
  const context = el("textarea"); context.placeholder = "Context this person may be told (optional)"
  const call = el("button", "go", state.simulate ? "Start simulated call" : "Call selected person")
  call.dataset.locked = String(current.status !== "open")
  call.onclick = () => {
    if (!question.value.trim()) { showError("Write the question first."); return }
    const queued = (state.attempt_progress || []).filter(p => p.support_case_id === current.id && p.transport === "queued")
    if (queued.length) { showError("A call is already queued. Wait for its status before adding another in this manual console."); return }
    send(call, async () => {
      await command("/cases/" + current.id + "/calls", {
        expected_input_revision: current.input_revision, profile_id: Number(person.value),
        question: question.value, context: context.value, queued: [],
      })
      question.value = ""; context.value = ""
    })
  }
  box.append(person, question, context, call)
  box.append(el("h2", "", "Update objective or contact scope"))
  const objective = el("textarea"); objective.value = current.goal
  const scope = el("input"); scope.value = JSON.stringify(current.scope || { profile_ids: [] })
  const save = el("button", "", "Save configuration")
  save.dataset.locked = String(current.status !== "open")
  save.onclick = () => send(save, () => command("/cases/" + current.id + "/configuration", {
    expected_input_revision: current.input_revision, objective: objective.value, scope: JSON.parse(scope.value),
  }))
  box.append(objective, scope, save)
  return box
}

// -------------------------------------------------------------------- boot

document.getElementById("searchProfiles").onclick = event => send(event.currentTarget, async () => {
  const filter = JSON.parse(document.getElementById("directoryFilter").value || "{}")
  const response = await fetch("/profiles?filter=" + encodeURIComponent(JSON.stringify(filter)) + "&limit=100")
  const result = await response.json()
  if (!response.ok) throw new Error(result.error || "Search failed")
  directory = result.profiles
})
document.getElementById("openIncident").onclick = (event) => {
  const text = els.newIncident.value
  const objective = els.newObjective.value
  if (!text.trim() || !objective.trim()) { showError("Describe the incident and what you need to know."); return }
  send(event.currentTarget, async () => {
    const result = await command("/incidents", { text, objective, scope: { profile_ids: [...selectedProfiles] } })
    selectedIncident = result.incident_id
    selectedCase = result.support_case_id
    els.newIncident.value = ""; els.newObjective.value = ""
  })
}

tick()
setInterval(tick, POLL_MS)
</script>
</body>
</html>
